name: Collect and publish the source of a PollySec OS release

# Run once per Flatcar Container Linux release that a PollySec sensor
# appliance version is built from, BEFORE that version is offered to anyone.
# It publishes a GitHub release named after the Flatcar version, holding the
# complete corresponding source (collect-source.sh). A published release is
# written once: the run refuses a version that already has one.
#
# Two jobs: the collection runs Flatcar's scripts and SDK with no token at
# all; only the publish job, which runs nothing but checks and uploads, may
# write to this repository.

on:
  workflow_dispatch:
    inputs:
      flatcar_version:
        description: 'Flatcar Container Linux release, e.g. 4081.3.12 (needs pins/<version>.env)'
        required: true
      channel:
        description: 'Flatcar channel of that release'
        type: choice
        options: [lts, stable]
        default: lts

permissions: {}

concurrency:
  group: source-${{ inputs.flatcar_version }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.flatcar_version }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Free disk space for the SDK
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force >/dev/null
          df -h /

      - name: Collect the source
        run: ./collect-source.sh "$CHANNEL" "$VERSION" "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source
          path: ${{ runner.temp }}/out/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.flatcar_version }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: source
          path: out

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$VERSION' is not a version like 4081.3.12"; exit 1; }
          cd out
          sha256sum -c --quiet SHA256SUMS
          # Every file the release will hold is in SHA256SUMS, and nothing else.
          diff <(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort) \
               <(awk '{ print $2 }' SHA256SUMS | LC_ALL=C sort) \
            || { echo "::error::SHA256SUMS does not list exactly the collected files"; exit 1; }

          # A published release is never replaced. A draft is an upload that
          # never finished, which nobody was offered: it is removed.
          if draft=$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            [[ "$draft" == "true" ]] || { echo "::error::release $VERSION is published: a release is written once"; exit 1; }
            gh release delete "$VERSION" --repo "$GITHUB_REPOSITORY" --yes
          fi

          info=$(cat SOURCE-INFO.txt)
          notes=$(printf '%s\n' \
            "The complete corresponding source of PollySec OS, the operating system of the PollySec sensor appliance, for the appliance versions based on Flatcar Container Linux $VERSION ($CHANNEL, amd64)." \
            "" \
            '```' "$info" '```' \
            "" \
            "- \`flatcar-scripts-$CHANNEL-$VERSION.tar.gz\`: Flatcar's build scripts, package definitions, patches and kernel configuration at tag \`$CHANNEL-$VERSION\`." \
            "- \`pollysec-os-source-$VERSION.tar.part-NN\`: the source of every package on the appliance's disks (each source archive its package definition names, and each repository a package is built from at its commit), in one tar split into parts. Unpack with \`cat pollysec-os-source-$VERSION.tar.part-* | tar -x\`. \`SOURCES.SHA256SUMS\` lists the SHA-256 of each archive in it." \
            "- \`PACKAGES.txt\`: every package, as built. The \`*_packages.txt\` files: the lists Flatcar published for the release." \
            "- \`SHA256SUMS\`: every file of this release." \
            "" \
            "How the source was collected, and how to ask for a copy: see the README." \
            "" \
            "Flatcar is a trademark of LF Projects, LLC. PollySec OS is produced by PollySec AB. Neither the Flatcar project nor LF Projects, LLC produces, endorses or supports it.")
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "PollySec OS source for Flatcar Container Linux $VERSION" --notes "$notes" ./*

          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | LC_ALL=C sort > "$RUNNER_TEMP/uploaded"
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$RUNNER_TEMP/local"
          diff "$RUNNER_TEMP/local" "$RUNNER_TEMP/uploaded" || { echo "::error::the release's assets are not the collected files"; exit 1; }
          url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION"
          code=$(curl -s -o /dev/null -I -L -w '%{http_code}' "$url")
          [[ "$code" == "200" ]] || { echo "::error::$url answers $code"; exit 1; }
          echo "DONE: $url" | tee -a "$GITHUB_STEP_SUMMARY"
